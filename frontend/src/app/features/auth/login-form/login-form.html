<p-card>
  <h2>Se connecter</h2>
  <form [formGroup]="form" (ngSubmit)="login()">
    <div class="field">
      <label for="email">Adresse e-mail</label>
      <input formControlName="email" id="email" type="text" pInputText class="w-full">
      <small class="invalid-feedback">Champ obligatoire</small>
    </div>
    <div class="field">
      <label for="password">Mot de passe</label>
      <p-password formControlName="password" inputId="password" class="w-full" inputStyleClass="w-full"/>
      <small class="invalid-feedback">Champ obligatoire</small>
    </div>
  </form>
  <p-button
    type="submit"
    label="Se connecter"
    class="w-full"
  />
</p-card>
